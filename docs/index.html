<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geckodupe Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Geckodupe API and product documentation">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="docs-theme.css">
</head>
<body>
  <div id="app">Loading docs…</div>
  <script>
    window.$docsify = {
      name: 'Geckodupe Docs',
      nameLink: '#/',

      loadSidebar: false,
      subMaxLevel: 2,

      notFoundPage: true,
      executeScript: false,
      noEmoji: true,
      hideSidebar: true
