<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geckodupe Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Geckodupe API and product documentation">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="docs-theme.css">
</head>
<body>
  <div id="app">Loading docs…</div>
  <script>
    (function () {
      var path = location.pathname || '';
      var base = path.replace(/\/[^/]*$/, '/');
      if (base.indexOf('/docs') === -1 && path.indexOf('/docs') === -1) {
        base = path.replace(/\/?$/, '/') + 'docs/';
      }
      window.$docsify = {
        el: '#app',
        name: 'Geckodupe Docs',
        loadSidebar: false,
        subMaxLevel: 2,
        auto2top: true,
        homepage: 'README.md',
        themeColor: '#f7831e',
        notFoundPage: '_404.md',
        noEmoji: true,
        routerMode: 'hash',
        basePath: base
      };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
