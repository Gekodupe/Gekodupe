<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Not found - Geckodupe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="5;url=/#text-file">
  <link rel="icon" type="image/x-icon" href="public/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="public/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Coming+Soon&family=Quattrocento+Sans:wght@400;700&display=swap">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{height:100%}
    body{margin:0;min-height:100%;background:#f7f9fa;color:#333;font-family:'Quattrocento Sans',sans-serif;-webkit-font-smoothing:antialiased}
    .nf-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px}
    .nf-card{width:100%;max-width:420px;background:#f4f0e3;border:2px solid #9f9c94;border-radius:8px;padding:36px 40px 32px;text-align:center;box-shadow:rgba(0,0,0,.08) 4px 8px 24px;animation:nfFadeIn .45s ease}
    @keyframes nfFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .nf-header{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:16px;border-bottom:2px dashed rgba(159,156,148,.9)}
    .nf-logo{width:40px;height:auto;opacity:.32}
    .nf-code{margin:0;font-family:monospace;font-size:.78em;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:#8ba335}
    .nf-title{margin:0;font-family:'Coming Soon',cursive;font-size:1.45em;font-weight:400;color:#333;line-height:1.3}
    .nf-message{margin:0 0 22px;font-size:.92em;line-height:1.55;color:rgba(90,87,72,.82)}
    .nf-progress{height:4px;margin:0 auto 14px;max-width:200px;background:rgba(159,156,148,.22);border-radius:2px;overflow:hidden}
    .nf-progress-bar{display:block;height:100%;width:0%;background:linear-gradient(90deg,#9ab33b,#b0cc45);border-radius:2px;transition:width .08s linear}
    .nf-redirect{margin:0 0 20px;font-size:.8em;color:rgba(90,87,72,.55);font-variant-numeric:tabular-nums}
    .nf-home{display:inline-block;padding:6px 16px;font-family:'Quattrocento Sans',sans-serif;font-size:.88em;font-weight:400;color:#8ba335;text-decoration:none;border:1px solid #b0cc45;border-radius:6px;background:transparent;transition:background .2s ease,color .2s ease}
    .nf-home:hover,.nf-home:focus-visible{background:rgba(176,204,69,.15);color:#6b7a28;outline:none}
    .nf-home:focus-visible{box-shadow:0 0 0 3px rgba(176,204,69,.3)}
    @media (prefers-reduced-motion:reduce){.nf-card{animation:none}.nf-progress-bar{transition:none}}
    @media (max-width:480px){.nf-card{padding:28px 24px 24px}.nf-title{font-size:1.3em}}
  </style>
</head>
<body>
  <div class="nf-wrap">
    <main class="nf-card" role="main" aria-labelledby="nf-title">
      <header class="nf-header">
        <img src="public/gecko-symbol.svg" alt="" class="nf-logo" width="40" height="40" aria-hidden="true">
        <p class="nf-code" aria-hidden="true">404</p>
        <h1 class="nf-title" id="nf-title">Page not found</h1>
      </header>

      <p class="nf-message">This page isn&rsquo;t here. Taking you back home.</p>

      <div class="nf-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Redirecting home">
        <span class="nf-progress-bar" id="nf-bar"></span>
      </div>

      <p class="nf-redirect">Redirecting in <span id="nf-seconds">4</span>s</p>

      <a href="/#text-file" class="nf-home" id="nf-home">Go home now</a>
    </main>
  </div>

  <script src="js/404.js"></script>
</body>
</html>
